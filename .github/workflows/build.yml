name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # para makapag-attach ng APK sa GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK (platform 34 + build-tools)
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Kung may KEYSTORE_BASE64 secret -> signed release; kundi -> debug APK
      - name: Prepare keystore (kung may secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/ci-keystore.jks
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            printf 'storeFile=ci-keystore.jks\nstorePassword=%s\nkeyAlias=ighelper\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" > app/keystore.properties
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk IGHelper.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk IGHelper.apk
          fi

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: IGHelper
          path: IGHelper.apk
          if-no-files-found: error

      - name: Attach sa GitHub Release (kapag may tag v1.2 ...)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" IGHelper.apk \
            --title "IG Helper $GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" IGHelper.apk --clobber
